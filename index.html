<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Для тебя">
<meta property="og:description" content="Открой, это тебе">
<meta name="theme-color" content="#020812">
<title>Твои глаза словно море</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Marck+Script&display=swap">
<style>
  /* Один экран: ночь, в центре глаз с морем в радужке; вода поднимается и заливает экран, вторая строка тонет. */
  :root {
    color-scheme: dark;
    --bg: #020812;
    --sea-deep: #04233f;
    --sea: #0b6e99;
    --aqua: #5fd6e8;
    --foam: #d9fbff;
    --glow: rgba(95, 214, 232, 0.55);
    --muted: #5d8ea3;
    --font-hand: "Marck Script", "Segoe Script", "Snell Roundhand", cursive;
    --font-word: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--foam);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: manipulation;
  }
  h1 {
    position: fixed;
    left: 0; right: 0;
    top: calc(env(safe-area-inset-top, 0px) + 7vh);
    margin: 0;
    padding-inline: 16px;
    text-align: center;
    text-wrap: balance;
    font: 400 clamp(1.9rem, 9vw, 3.4rem)/1.15 var(--font-hand);
    color: var(--foam);
    text-shadow: 0 0 14px var(--glow), 0 0 44px var(--glow);
    pointer-events: none;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 1.8s ease, transform 1.8s ease;
  }
  p {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 4vh);
    margin: 0;
    text-align: center;
    font: 800 0.7rem/1 var(--font-word);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.6s ease;
  }
  .on { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    h1, p { transition: none; }
  }
</style>

<canvas id="scene" aria-label="Глаз, в радужке которого море. Вода поднимается, и слова «я в них утопаю» опускаются на глубину"></canvas>
<h1 id="title">Твои глаза словно море</h1>
<p id="hint">коснись воды</p>

<script>
(function () {
  var LINE2 = 'я в них утопаю';
  var RISE_FROM = 4.5, RISE_TIME = 4.5, SINK_FROM = 9.6;

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var title = document.getElementById('title');
  var hint = document.getElementById('hint');
  var css = getComputedStyle(document.documentElement);
  var HAND = css.getPropertyValue('--font-hand').trim();
  var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W = 0, H = 0, dpr = 1, cx = 0, ey = 0, r = 60, size = 40;
  var stars = [], fibres = [], letters = [], bubbles = [], ripples = [];
  var glow = [], shoots = [], hs = 1, hcy = 0, nextShoot = 1.5;
  var t = calm ? 30 : 0, last = 0, running = false;

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

  function build() {
    var box = canvas.getBoundingClientRect();
    W = box.width || window.innerWidth || 360;
    H = box.height || window.innerHeight || 640;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    cx = W / 2;
    ey = H * 0.41;
    r = Math.max(30, Math.min((W - 20) / 5.2, H * 0.11));

    // светящиеся огоньки: сначала плавают, потом собираются в сердце вокруг глаза
    hs = r / 6.4;
    hcy = ey + 4.5 * hs;
    glow = [];
    for (var gi = 0; gi < 150; gi++) {
      var ga = gi / 150 * 6.283, gs = Math.sin(ga);
      glow.push({
        tx: cx + 16 * gs * gs * gs * hs,
        ty: hcy - (13 * Math.cos(ga) - 5 * Math.cos(2 * ga) - 2 * Math.cos(3 * ga) - Math.cos(4 * ga) + 2.5) * hs,
        fx: Math.random() * W, fy: Math.random() * H,
        ph: Math.random() * 6.28, r: 1 + Math.random() * 1.6
      });
    }

    stars = [];
    for (var i = 0; i < 60; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.1 + 0.3, ph: Math.random() * 6.28 });
    }
    fibres = [];
    for (var f = 0; f < 120; f++) {
      fibres.push({ a: Math.random() * 6.283, len: 0.6 + Math.random() * 0.4, al: 0.08 + Math.random() * 0.3 });
    }

    // вторая строка: место каждой буквы
    size = Math.min(W * 0.105, 46);
    ctx.font = '400 ' + size + 'px ' + HAND;
    var total = ctx.measureText(LINE2).width;
    if (total > W - 40) {
      size *= (W - 40) / total;
      ctx.font = '400 ' + size + 'px ' + HAND;
      total = ctx.measureText(LINE2).width;
    }
    var x0 = cx - total / 2;
    letters = [];
    for (var k = 0; k < LINE2.length; k++) {
      var ch = LINE2[k];
      if (ch === ' ') continue;
      var before = ctx.measureText(LINE2.slice(0, k)).width;
      letters.push({ ch: ch, x: x0 + before + ctx.measureText(ch).width / 2, i: letters.length, ph: Math.random() * 6.28 });
    }
  }

  function heartPath(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.9);
    ctx.bezierCurveTo(x - s * 1.6, y - s * 0.2, x - s * 0.7, y - s * 1.3, x, y - s * 0.45);
    ctx.bezierCurveTo(x + s * 0.7, y - s * 1.3, x + s * 1.6, y - s * 0.2, x, y + s * 0.9);
  }

  function addBubble(x, y, big) {
    bubbles.push({ heart: big, x: x, y: y, r: (big ? 2 : 1) + Math.random() * (big ? 5 : 3.5), vy: 30 + Math.random() * 60, ph: Math.random() * 6.28 });
  }

  function drawEye(alpha) {
    var a = r * 2.1, up = r * 0.92, down = r * 0.82;
    var lid = new Path2D();
    lid.moveTo(cx - a, ey);
    lid.quadraticCurveTo(cx, ey - up * 2, cx + a, ey);
    lid.quadraticCurveTo(cx, ey + down * 2, cx - a, ey);

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(190,225,255,0.07)';
    ctx.fill(lid);
    ctx.clip(lid);

    // радужка
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, ey, r, 0, 6.283); ctx.clip();
    var g = ctx.createRadialGradient(cx, ey, r * 0.3, cx, ey, r);
    g.addColorStop(0, '#9af0f7');
    g.addColorStop(0.45, '#1c9cc4');
    g.addColorStop(0.85, '#0a4f7d');
    g.addColorStop(1, '#03203b');
    ctx.fillStyle = g;
    ctx.fillRect(cx - r, ey - r, r * 2, r * 2);

    ctx.lineWidth = 1;
    for (var i = 0; i < fibres.length; i++) {
      var fb = fibres[i], ang = fb.a + t * 0.03;
      ctx.strokeStyle = 'rgba(217,251,255,' + fb.al.toFixed(2) + ')';
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * r * 0.36, ey + Math.sin(ang) * r * 0.36);
      ctx.lineTo(cx + Math.cos(ang) * r * fb.len, ey + Math.sin(ang) * r * fb.len);
      ctx.stroke();
    }

    // волны внутри радужки
    var bands = [
      { y: 0.18, amp: 0.06, k: 0.07, sp: 1.6, col: 'rgba(217,251,255,0.14)' },
      { y: 0.42, amp: 0.05, k: 0.09, sp: -1.2, col: 'rgba(4,35,63,0.38)' },
      { y: 0.66, amp: 0.04, k: 0.11, sp: 2.0, col: 'rgba(2,14,30,0.45)' }
    ];
    for (var b = 0; b < bands.length; b++) {
      var bd = bands[b];
      ctx.beginPath();
      ctx.moveTo(cx - r, ey + r);
      for (var x = cx - r; x <= cx + r + 3; x += 3) {
        ctx.lineTo(x, ey + r * bd.y + Math.sin(x * bd.k + t * bd.sp) * r * bd.amp);
      }
      ctx.lineTo(cx + r, ey + r);
      ctx.fillStyle = bd.col;
      ctx.fill();
    }
    ctx.restore();

    // зрачок и блики
    ctx.fillStyle = '#01060d';
    ctx.beginPath(); ctx.arc(cx, ey, r * 0.36, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(cx - r * 0.3, ey - r * 0.36, r * 0.12, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.arc(cx + r * 0.26, ey + r * 0.3, r * 0.05, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(2,14,30,0.9)';
    ctx.lineWidth = Math.max(2, r * 0.07);
    ctx.beginPath(); ctx.arc(cx, ey, r, 0, 6.283); ctx.stroke();
    ctx.restore();

    // контур века
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#5fd6e8';
    ctx.shadowColor = '#5fd6e8';
    ctx.shadowBlur = 16;
    ctx.lineWidth = 1.6;
    ctx.stroke(lid);
    ctx.restore();
  }

  function frame(now) {
    var dt = Math.min((now - last) / 1000 || 0, 0.033);
    last = now; t += dt;

    var p = clamp01((t - RISE_FROM) / RISE_TIME);
    var e = p * p * (3 - 2 * p);
    var level = (H + 30) + (-70 - (H + 30)) * e;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // звёзды
    ctx.fillStyle = '#d9fbff';
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      ctx.globalAlpha = 0.15 + 0.25 * (0.5 + 0.5 * Math.sin(t * 1.3 + st.ph));
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // месяц
    var mx = W * 0.84, my = H * 0.2, mr = Math.max(10, Math.min(W, H) * 0.035);
    var mg = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 5);
    mg.addColorStop(0, 'rgba(217,251,255,0.22)');
    mg.addColorStop(1, 'rgba(217,251,255,0)');
    ctx.fillStyle = mg;
    ctx.fillRect(mx - mr * 5, my - mr * 5, mr * 10, mr * 10);
    ctx.fillStyle = '#eefcff';
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#04101f';
    ctx.beginPath(); ctx.arc(mx + mr * 0.45, my - mr * 0.2, mr * 0.9, 0, 6.283); ctx.fill();

    // падающие звёзды, пока вода не поднялась
    if (!calm && t > nextShoot && t < RISE_FROM + RISE_TIME - 1.5) {
      shoots.push({ x: W * (0.3 + Math.random() * 0.75), y: H * (0.04 + Math.random() * 0.26), life: 0 });
      nextShoot = t + 1.1 + Math.random() * 1.4;
    }
    ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    for (var sh = shoots.length - 1; sh >= 0; sh--) {
      var so = shoots[sh];
      so.life += dt;
      if (so.life > 0.75) { shoots.splice(sh, 1); continue; }
      so.x -= 520 * dt; so.y += 235 * dt;
      var tail = ctx.createLinearGradient(so.x, so.y, so.x + 80, so.y - 36);
      tail.addColorStop(0, 'rgba(238,252,255,' + (0.9 * Math.sin(Math.PI * so.life / 0.75)).toFixed(3) + ')');
      tail.addColorStop(1, 'rgba(238,252,255,0)');
      ctx.strokeStyle = tail;
      ctx.beginPath(); ctx.moveTo(so.x, so.y); ctx.lineTo(so.x + 80, so.y - 36); ctx.stroke();
    }

    // мягкое свечение вокруг глаза
    var halo = ctx.createRadialGradient(cx, ey, 0, cx, ey, r * 4.2);
    halo.addColorStop(0, 'rgba(40,160,200,0.22)');
    halo.addColorStop(1, 'rgba(40,160,200,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, W, H);

    drawEye(clamp01((t - 0.3) / 1.6));

    // вода: три слоя волн
    var cols = ['rgba(11,110,153,0.40)', 'rgba(7,70,115,0.46)', 'rgba(4,35,63,0.55)'];
    for (var j = 0; j < 3; j++) {
      ctx.beginPath();
      ctx.moveTo(-6, H + 6);
      for (var x = -6; x <= W + 8; x += 8) {
        ctx.lineTo(x, level + j * 14 +
          Math.sin(x * 0.012 * (1 + j * 0.3) + t * (0.9 + j * 0.35) + j * 2) * (10 - j * 2) +
          Math.sin(x * 0.031 + t * 1.7 + j) * 3);
      }
      ctx.lineTo(W + 6, H + 6);
      ctx.closePath();
      ctx.fillStyle = cols[j];
      ctx.fill();
      if (j === 0) { ctx.strokeStyle = 'rgba(217,251,255,0.35)'; ctx.lineWidth = 1.2; ctx.stroke(); }
    }

    // под водой глаз продолжает светиться
    if (e > 0.6) drawEye(0.55 * clamp01((e - 0.6) / 0.4));

    // глубина и лучи света
    if (e > 0) {
      var deep = ctx.createLinearGradient(0, Math.max(level, 0), 0, H);
      deep.addColorStop(0, 'rgba(2,8,18,0)');
      deep.addColorStop(1, 'rgba(2,8,18,' + (0.72 * e).toFixed(3) + ')');
      ctx.fillStyle = deep;
      ctx.fillRect(0, Math.max(level, 0), W, H);
    }
    var rays = clamp01((e - 0.85) / 0.15);
    if (rays > 0) {
      ctx.globalCompositeOperation = 'lighter';
      for (var q = 0; q < 5; q++) {
        var rx = W * (0.08 + 0.21 * q) + Math.sin(t * 0.2 + q) * 24, wide = 26 + q % 2 * 22;
        ctx.fillStyle = 'rgba(120,220,240,' + (0.05 * rays * (0.55 + 0.45 * Math.sin(t * 0.7 + q * 1.7))).toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(rx, -10); ctx.lineTo(rx + wide, -10);
        ctx.lineTo(rx + wide * 2.4 - H * 0.28, H * 0.95); ctx.lineTo(rx - wide - H * 0.28, H * 0.95);
        ctx.closePath(); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    // огоньки: плавают под водой, потом складываются в сердце
    if (e > 0.5) {
      var gth = clamp01((t - 14.5) / 4.5);
      gth = gth * gth * (3 - 2 * gth);
      var beat = 1 + 0.035 * Math.sin(t * 2.4) * gth;
      var cr = Math.round(95 + 160 * gth), cg = Math.round(214 - 74 * gth), cb = Math.round(232 - 47 * gth);
      ctx.globalCompositeOperation = 'lighter';
      for (var gp = 0; gp < glow.length; gp++) {
        var P = glow[gp];
        var fx = P.fx + Math.sin(t * 0.3 + P.ph) * 30, fy = P.fy + Math.cos(t * 0.25 + P.ph) * 24;
        var hx = cx + (P.tx - cx) * beat, hy = hcy + (P.ty - hcy) * beat;
        var px = fx + (hx - fx) * gth + Math.sin(t * 1.7 + P.ph) * 2;
        var py = fy + (hy - fy) * gth + Math.cos(t * 1.4 + P.ph) * 2;
        var pa = (e - 0.5) * 2 * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 2 + P.ph * 3)));
        ctx.fillStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (pa * 0.16).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(px, py, P.r * 3.4, 0, 6.283); ctx.fill();
        ctx.fillStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + pa.toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(px, py, P.r * (1 + gth * 0.4), 0, 6.283); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    // пузырьки
    if (!calm && t > 6 && Math.random() < dt * 3) addBubble(Math.random() * W, H + 10, false);
    ctx.lineWidth = 1;
    for (var b = bubbles.length - 1; b >= 0; b--) {
      var bb = bubbles[b];
      bb.y -= bb.vy * dt;
      bb.x += Math.sin(t * 2.2 + bb.ph) * 14 * dt;
      if (bb.y < Math.max(level, -12)) { bubbles.splice(b, 1); continue; }
      if (bb.heart) {
        ctx.strokeStyle = 'rgba(255,175,208,0.85)';
        ctx.fillStyle = 'rgba(255,140,185,0.2)';
        heartPath(bb.x, bb.y, bb.r * 1.5);
      } else {
        ctx.strokeStyle = 'rgba(217,251,255,0.55)';
        ctx.fillStyle = 'rgba(95,214,232,0.10)';
        ctx.beginPath(); ctx.arc(bb.x, bb.y, bb.r, 0, 6.283);
      }
      ctx.fill(); ctx.stroke();
    }

    // круги от касания
    for (var c = ripples.length - 1; c >= 0; c--) {
      var rp = ripples[c];
      rp.life += dt;
      if (rp.life > 0.9) { ripples.splice(c, 1); continue; }
      ctx.strokeStyle = 'rgba(217,251,255,' + (0.6 * (1 - rp.life / 0.9)).toFixed(3) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(rp.x, rp.y, 10 + rp.life * 150, 0, 6.283); ctx.stroke();
    }

    // «я в них утопаю»: буквы опускаются на глубину
    if (t > SINK_FROM) {
      var fromY = H * 0.3, restY = Math.min(H * 0.84, H - 76);
      ctx.font = '400 ' + size + 'px ' + HAND;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#d9fbff';
      ctx.shadowColor = '#5fd6e8'; ctx.shadowBlur = 14;
      for (var n = 0; n < letters.length; n++) {
        var L = letters[n], lt = t - SINK_FROM - L.i * 0.2;
        if (lt <= 0) continue;
        var u = clamp01(lt / 3.4), fall = 1 - Math.pow(1 - u, 3);
        var y = fromY + (restY - fromY) * fall + Math.sin(t * 1.1 + L.ph) * 3;
        var x = L.x + Math.sin(t * 1.5 + L.ph) * 9 * (1 - fall);
        ctx.globalAlpha = clamp01(lt / 0.7);
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.sin(t * 1.3 + L.ph) * 0.3 * (1 - fall));
        ctx.fillText(L.ch, 0, 0);
        ctx.restore();
        if (!calm && u < 1 && Math.random() < dt * 2.5) addBubble(x, y - size * 0.3, false);
      }
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }

    if (t > 0.8) title.classList.add('on');
    if (t > 15) hint.classList.add('on');
    requestAnimationFrame(frame);
  }

  canvas.addEventListener('pointerdown', function (ev) {
    var box = canvas.getBoundingClientRect();
    var x = ev.clientX - box.left, y = ev.clientY - box.top;
    ripples.push({ x: x, y: y, life: 0 });
    for (var i = 0; i < 16; i++) addBubble(x + (Math.random() - 0.5) * 40, y + (Math.random() - 0.5) * 30, true);
    hint.classList.remove('on');
  });

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(build, 150);
  });

  function start() {
    if (running) return;
    running = true;
    build();
    requestAnimationFrame(function (now) { last = now; frame(now); });
  }

  // ждём шрифты, но не дольше полутора секунд
  var fontsReady = document.fonts && document.fonts.load
    ? document.fonts.load('400 16px "Marck Script"', 'Твои')
    : Promise.resolve();
  fontsReady.then(start, start);
  setTimeout(start, 1500);
})();
</script>
